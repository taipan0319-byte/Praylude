# Builds the Flutter web preview and publishes it to GitHub Pages on every
# push to main. Ryan: enable this once under Settings → Pages by setting
# Source to "GitHub Actions".
name: Deploy web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --project-name praylude --org com.praylude --platforms web
      - run: flutter pub get
      - run: flutter test
      # Case must match the repo name exactly — GitHub Pages paths are case-sensitive
      - run: flutter build web --release --base-href /Praylude/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
